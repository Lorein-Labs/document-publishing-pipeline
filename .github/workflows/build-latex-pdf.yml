name: Build Academic LaTeX PDF
on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Create absolute output directory
        run: |
          mkdir -p $PWD/dist-tex

      - name: Export Markdown to Standalone LaTeX (.tex)
        run: |
          pandoc README.md \
            --from markdown \
            --to latex \
            --standalone \
            -V geometry:a4paper \
            -V geometry:margin=2cm \
            -o $PWD/dist-tex/document.tex

      - name: Compile LaTeX (.tex) to PDF A4
        run: |
          cd $PWD/dist-tex
          pdflatex -interaction=nonstopmode document.tex
          pdflatex -interaction=nonstopmode document.tex

      - name: Verify and Upload Academic LaTeX Outputs
        uses: actions/upload-artifact@v4
        with:
          name: academic-latex-outputs
          path: |
            dist-tex/document.tex
            dist-tex/document.pdf
          retention-days: 30
