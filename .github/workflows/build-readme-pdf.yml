name: Build Documentation PDF (A4)

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  render-pdf:
    name: Compile Markdown to A4 PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and Typst
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          curl -fsSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz -o typst.tar.xz
          tar -xf typst.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          rm -rf typst.tar.xz typst-x86_64-unknown-linux-musl

      - name: Create output directory
        run: mkdir -p dist

      - name: Compile README.md to A4 PDF
        run: |
          pandoc README.md \
            --from markdown \
            --to pdf \
            --pdf-engine=typst \
            -V papersize=a4 \
            -V margin-top=2cm \
            -V margin-bottom=2cm \
            -V margin-left=2cm \
            -V margin-right=2cm \
            -o dist/document-publishing-pipeline-README-A4.pdf

      - name: Upload A4 PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-documents-a4
          path: dist/*.pdf
          retention-days: 30
