name: Lint Markdown Files

on:
  workflow_call:
    inputs:
      gov_ref:
        type: string
        required: false
        default: 'v0.19.0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Fetch central markdownlint config from governance repo
        uses: actions/checkout@v4
        with:
          repository: 'Lorein-Labs/document-publishing-system'
          ref: ${{ inputs.gov_ref || 'v0.19.0' }}
          token: ${{ secrets.LOREIN_GOV_TOKEN || github.token }}
          sparse-checkout: |
            .markdownlint-cli2.jsonc
          sparse-checkout-cone-mode: false
          path: '.gov-config'

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          config: '.gov-config/.markdownlint-cli2.jsonc'
          globs: |
            docs/**/*.md
            CHANGELOG.md
            README.md
