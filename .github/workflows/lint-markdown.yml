name: Lint Markdown Files

on:
  workflow_call:
    inputs:
      gov_ref:
        type: string
        required: false
        default: 'v0.21.0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Extract .markdownlint-cli2.jsonc from governance tag
        env:
          GH_TOKEN: ${{ secrets.LOREIN_GOV_TOKEN || github.token }}
          GOV_REF: ${{ inputs.gov_ref || 'v0.21.0' }}
        run: |
          mkdir -p .gov-config
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Lorein-Labs/document-publishing-system/contents/.markdownlint-cli2.jsonc?ref=$GOV_REF" \
            -o .gov-config/.markdownlint-cli2.jsonc

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          config: '.gov-config/.markdownlint-cli2.jsonc'
          globs: |
            docs/**/*.md
            CHANGELOG.md
            README.md
